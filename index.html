<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>令和8年度 卒業カウントダウン | 北海道滝川西高等学校</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0c1220;
      --bg-accent: #221426;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f4f5f7;
      --text-sub: #a0aab8;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(212, 175, 55, 0.25);
    }

    body[data-theme="sakura"] {
      --bg-base: #1f121b;
      --bg-accent: #38182a;
      --gold: #f2a6b8;
      --gold-light: #ffe0e8;
      --card-border: rgba(242, 166, 184, 0.3);
    }

    body[data-theme="emerald"] {
      --bg-base: #0b1918;
      --bg-accent: #132e2b;
      --gold: #c5a86a;
      --gold-light: #efe3c2;
      --card-border: rgba(197, 168, 106, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--bg-accent) 0%, var(--bg-base) 70%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }

    #petal-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 20px 32px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .school-motto {
      font-family: 'Shippori Mincho', serif;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .school-name {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #fff 20%, var(--gold-light) 60%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .notice-banner {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 28px;
      font-size: 0.92rem;
      text-align: center;
      color: var(--gold-light);
    }

    .notice-banner:empty {
      display: none;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .stat-card {
      text-align: center;
      position: relative;
    }

    .stat-label {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3.4rem, 7vw, 4.8rem);
      font-weight: 700;
      line-height: 1;
      color: #fff;
    }

    .stat-unit {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.1rem;
      margin-left: 6px;
      color: var(--gold-light);
    }

    .stat-sub {
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .clock-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 28px;
      padding: 16px;
      text-align: center;
    }

    .clock-item span {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1.1;
    }

    .clock-item small {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--text-sub);
    }

    .progress-section {
      margin-bottom: 28px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 10px;
      color: var(--text-sub);
    }

    .progress-header strong {
      color: var(--gold-light);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 99px;
      transition: width 0.8s ease;
    }

    .section-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 1.1rem;
      color: var(--gold-light);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-list {
      list-style: none;
    }

    .event-list li {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.92rem;
    }

    .event-list li:last-child {
      border-bottom: none;
    }

    .event-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gold);
      min-width: 105px;
    }

    .event-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
      margin-left: auto;
      white-space: nowrap;
    }

    .event-list li.is-past {
      opacity: 0.45;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    footer a {
      color: var(--text-sub);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    footer a:hover {
      opacity: 1;
      color: var(--gold-light);
    }
  </style>
</head>
<body data-theme="navy">
  <canvas id="petal-canvas"></canvas>

  <div class="wrapper">
    <header>
      <div class="school-motto" id="school-motto">志あるものは事ついに成る</div>
      <div class="school-name" id="school-name">北海道滝川西高等学校</div>
      <h1 id="page-title">卒業証書授与式 カウントダウン</h1>
    </header>

    <div class="notice-banner" id="notice-banner"></div>

    <div class="stats-grid">
      <div class="card stat-card">
        <div class="stat-label">卒業式まで あと</div>
        <div>
          <span class="stat-value" id="days-left">--</span>
          <span class="stat-unit">日</span>
        </div>
        <div class="stat-sub" id="grad-date-text">2027年3月1日(月) 挙行</div>
      </div>

      <div class="card stat-card">
        <div class="stat-label">残り登校日数</div>
        <div>
          <span class="stat-value" id="school-days-left">--</span>
          <span class="stat-unit">日</span>
        </div>
        <div class="stat-sub">休日・長期休業・家庭学習期間を除く</div>
      </div>
    </div>

    <div class="card clock-bar">
      <div class="clock-item">
        <span id="rem-hours">00</span>
        <small>HOURS</small>
      </div>
      <div class="clock-item">
        <span id="rem-mins">00</span>
        <small>MINUTES</small>
      </div>
      <div class="clock-item">
        <span id="rem-secs">00</span>
        <small>SECONDS</small>
      </div>
    </div>

    <div class="card progress-section">
      <div class="progress-header">
        <span>3年次 始業式からの経過</span>
        <strong id="progress-percent">0.0%</strong>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">
        <span>今後の主な学年日程</span>
        <small style="font-family: 'Noto Sans JP', sans-serif; font-size: 0.75rem; color: var(--text-sub);">令和8年度 年間行事予定</small>
      </div>
      <ul class="event-list" id="event-list"></ul>
    </div>

　　<footer>
      <p id="sync-status" style="margin-bottom: 6px;"></p>
      <a href="/adm.html">管理画面</a>
    </footer>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      schoolMotto: "志あるものは事ついに成る",
      schoolName: "北海道滝川西高等学校",
      pageTitle: "卒業証書授与式 カウントダウン",
      notice: "",
      theme: "navy",
      startDate: "2026-04-08",
      graduationDate: "2027-03-01",
      graduationTime: "10:00",
      holidayRanges: [
        { label: "夏季休業", start: "2026-07-24", end: "2026-08-18" },
        { label: "冬季休業", start: "2026-12-24", end: "2027-01-12" },
        { label: "3年家庭学習期間", start: "2027-02-01", end: "2027-02-26" }
      ],
      holidays: [
        "2026-04-29", "2026-05-03", "2026-05-04", "2026-05-05", "2026-05-06",
        "2026-07-20", "2026-08-11", "2026-09-21", "2026-09-22", "2026-09-23",
        "2026-10-12", "2026-11-03", "2026-11-23", "2027-01-01", "2027-01-11",
        "2027-02-11", "2027-02-23"
      ],
      extraSchoolDays: [
        "2027-02-02",
        "2027-02-26",
        "2027-02-28"
      ],
      extraOffDays: [],
      milestones: [
        { date: "2026-11-18", title: "3学年末考査（〜24日）" },
        { date: "2026-12-24", title: "冬季休業開始（〜1月12日）" },
        { date: "2027-01-16", title: "大学入学共通テスト（16日・17日）" },
        { date: "2027-02-01", title: "3年 家庭学習期間開始" },
        { date: "2027-02-02", title: "3年登校日" },
        { date: "2027-02-26", title: "3年登校日・進路別説明会" },
        { date: "2027-02-28", title: "式場設営・賞状授与式・同窓会入会式" },
        { date: "2027-03-01", title: "卒業証書授与式" }
      ]
    };

    let config = structuredClone(DEFAULT_CONFIG);

    function parseLocalDate(str) {
      const [y, m, d] = str.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatYMD(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function formatJPDate(str) {
      const d = parseLocalDate(str);
      const weeks = ["日", "月", "火", "水", "木", "金", "土"];
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${weeks[d.getDay()]})`;
    }

    function isSchoolDay(dateObj) {
      const ymd = formatYMD(dateObj);
      if (config.extraSchoolDays.includes(ymd)) return true;
      if (config.extraOffDays.includes(ymd)) return false;

      const day = dateObj.getDay();
      if (day === 0 || day === 6) return false;
      if (config.holidays.includes(ymd)) return false;

      for (const range of config.holidayRanges) {
        if (ymd >= range.start && ymd <= range.end) return false;
      }
      return true;
    }

    function countRemainingSchoolDays(now) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const grad = parseLocalDate(config.graduationDate);
      if (today > grad) return 0;

      let count = 0;
      const cursor = new Date(today);
      while (cursor <= grad) {
        if (isSchoolDay(cursor)) count++;
        cursor.setDate(cursor.getDate() + 1);
      }
      return count;
    }

    function applyConfigToDOM() {
      document.body.dataset.theme = config.theme || "navy";
      document.getElementById("school-motto").textContent = config.schoolMotto;
      document.getElementById("school-name").textContent = config.schoolName;
      document.getElementById("page-title").textContent = config.pageTitle;
      document.getElementById("notice-banner").textContent = config.notice || "";
      document.getElementById("grad-date-text").textContent = `${formatJPDate(config.graduationDate)} 挙行`;

      const listEl = document.getElementById("event-list");
      listEl.innerHTML = "";
      const todayYMD = formatYMD(new Date());

      const sorted = [...config.milestones].sort((a, b) => a.date.localeCompare(b.date));
      for (const item of sorted) {
        const li = document.createElement("li");
        const isPast = item.date < todayYMD;
        if (isPast) li.classList.add("is-past");

        const diffDays = Math.ceil((parseLocalDate(item.date) - parseLocalDate(todayYMD)) / 86400000);
        let badge = "";
        if (diffDays === 0) badge = "本日";
        else if (diffDays > 0) badge = `あと${diffDays}日`;
        else badge = "終了";

        li.innerHTML = `
          <span class="event-date">${item.date.replace(/-/g, "/")}</span>
          <span>${item.title}</span>
          <span class="event-badge">${badge}</span>
        `;
        listEl.appendChild(li);
      }
    }

    function updateTick() {
      const now = new Date();
      const [hh, mm] = (config.graduationTime || "10:00").split(":").map(Number);
      const gradDate = parseLocalDate(config.graduationDate);
      gradDate.setHours(hh, mm, 0, 0);

      const diffMs = gradDate - now;
      if (diffMs <= 0) {
        document.getElementById("days-left").textContent = "0";
        document.getElementById("school-days-left").textContent = "0";
        document.getElementById("rem-hours").textContent = "00";
        document.getElementById("rem-mins").textContent = "00";
        document.getElementById("rem-secs").textContent = "00";
      } else {
        const totalSecs = Math.floor(diffMs / 1000);
        const days = Math.floor(totalSecs / 86400);
        const hours = Math.floor((totalSecs % 86400) / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;

        document.getElementById("days-left").textContent = days;
        document.getElementById("rem-hours").textContent = String(hours).padStart(2, "0");
        document.getElementById("rem-mins").textContent = String(mins).padStart(2, "0");
        document.getElementById("rem-secs").textContent = String(secs).padStart(2, "0");
        document.getElementById("school-days-left").textContent = countRemainingSchoolDays(now);
      }

      const start = parseLocalDate(config.startDate);
      const totalSpan = gradDate - start;
      const elapsed = now - start;
      const pct = Math.min(100, Math.max(0, (elapsed / totalSpan) * 100));
      document.getElementById("progress-percent").textContent = `${pct.toFixed(1)}%`;
      document.getElementById("progress-fill").style.width = `${pct}%`;
    }

    async function loadRemoteConfig() {
      try {
        const res = await fetch("/api/config", { cache: "no-store" });
        if (!res.ok) return;
        const remote = await res.json();
        if (remote && Object.keys(remote).length > 0) {
          config = { ...DEFAULT_CONFIG, ...remote };
          if (remote.updatedAt) {
            const dt = new Date(remote.updatedAt);
            document.getElementById("sync-status").textContent =
              `最終更新: ${dt.toLocaleString("ja-JP")}`;
          }
        }
      } catch (_) {
        // ローカルプレビュー時などはデフォルト設定を使用
      } finally {
        applyConfigToDOM();
        updateTick();
      }
    }

    function initPetals() {
      const canvas = document.getElementById("petal-canvas");
      const ctx = canvas.getContext("2d");
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener("resize", () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const petals = Array.from({ length: 28 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 4 + Math.random() * 5,
        vy: 0.4 + Math.random() * 0.8,
        vx: -0.3 + Math.random() * 0.6,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.02
      }));

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (const p of petals) {
          p.y += p.vy;
          p.x += p.vx + Math.sin(p.angle) * 0.3;
          p.angle += p.spin;
          if (p.y > h + 10) {
            p.y = -10;
            p.x = Math.random() * w;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = "rgba(255, 224, 232, 0.28)";
          ctx.beginPath();
          ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    initPetals();
    loadRemoteConfig();
    setInterval(updateTick, 1000);
  </script>
</body>
</html>
